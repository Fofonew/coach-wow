<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mentor overlay</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="pill" class="pill" data-phase="idle" role="status" aria-live="polite">
    <div class="icon" aria-hidden="true">
      <div class="mic">
        <span class="halo"></span>
        <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-2.1A7 7 0 0 0 19 12h-2Z"/></svg>
      </div>
      <div class="spinner"></div>
      <div class="speaker">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Z"/></svg>
        <span class="wave one"></span>
        <span class="wave two"></span>
      </div>
      <div class="alert">!</div>
    </div>
    <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <span id="label"></span>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
