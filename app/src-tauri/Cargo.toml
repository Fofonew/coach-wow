[package]
name = "mentor"
version = "0.2.0"
description = "Mentor : coach vocal pour World of Warcraft, propulsé par Claude"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
simplelog = "0.12"
parking_lot = "0.12"
crossbeam-channel = "0.5"
regex = "1"
unicode-normalization = "0.1"
base64 = "0.22"
cpal = "0.16"
whisper-rs = { version = "0.15", features = ["vulkan"] }
sherpa-rs = { version = "0.6", default-features = false, features = ["tts", "download-binaries"] }
xcap = "0.7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tar = "0.4"
bzip2 = "0.5"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Security_Cryptography",
] }
msedge-tts = "0.4.1"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
minimp3 = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[patch.crates-io]
whisper-rs-sys = { path = "../vendor/whisper-rs-sys" }
